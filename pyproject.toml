[project]
name = "random"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.26.0",
]

[project.scripts]
random="rand.__main__:main"

[build_system]
requires=["setuptools"]
build-backend = "setuptools.build_meta"

[tools.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]